<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a7fc4">
<meta name="color-scheme" content="light dark">
<title>CrewCamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Fredoka:wght@400..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="friends.css">
<link rel="stylesheet" href="posts.css">
<script src="icons.js" defer></script>
</head>
<body class="th-white" data-mode="personal">
<script src="auth.js"></script>
<script src="servers.js" defer></script>
<header class="panel top">
  <div class="brand">
    <h1 class="logo-h"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="16" fill="#4a7fc4"/><path d="M14 16h8c2 0 3 1 3 3v22c0 3 1 5 3 6l-2 4H17c-2 0-3-1-3-3z" fill="#fff"/><path d="M27 16h25a2 2 0 0 1 2 2v25a2 2 0 0 1-2 2H27z" fill="#fff"/><path d="M30 18l9 2.500a2 2 0 0 1 1.500 2V36l-10.500 6z" fill="#7f97b3"/><path d="M38 41c5-1 11-1 13 4v1H38z" fill="#7f97b3"/><path d="M20.500 38l6 6L40 30" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.500 38l6 6L40 30" fill="none" stroke="#4a7fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm">CrewCamp</span></h1>
    <p class="sub"><i>Calendars and tasks for your team</i></p>
  </div>
  <div class="toolbar">
    <span class="stat who-tag" id="who"></span>
    <a class="mini" id="usersLink" href="users.html" hidden>Users</a>
  </div>
  <div class="stats">
    <div class="stat"><b id="sActive">0</b>Active</div>
    <div class="stat ok"><b id="sDone">0</b>Done</div>
    <div class="stat bad"><b id="sOver">0</b>Overdue</div>
  </div>
</header>

<nav class="modebar" aria-label="Calendar type">
  <button class="mode on" data-mode="personal" aria-pressed="true">
    <span class="ico">👤</span><span><b>Personal</b><small id="pSub">Your private notes</small></span><em id="bP">0</em>
  </button>
  <button class="mode" data-mode="shared" aria-pressed="false">
    <span class="ico">👥</span><span><b>Shared</b><small id="sSub">Team tasks</small></span><em id="bS">0</em>
  </button>
</nav>
<div class="repbar" id="repBar"><button class="btn" id="repBtn" type="button" aria-haspopup="dialog">🔁 Log repeating task</button></div>
<p class="sub hint">Tip: press <b>P</b> for Personal · <b>S</b> for Shared · <b>T</b> for today</p>

<main class="panel cal">
  <div class="calbar">
    <button class="btn" id="prev" aria-label="Previous month">‹</button>
    <h2 id="monthTitle"></h2>
    <button class="btn" id="next" aria-label="Next month">›</button>
    <button class="btn pri" id="goToday">Today</button>
    <label class="filter" id="filWrap" hidden>👁 Show <select id="fil"></select></label>
  </div>
  <div class="grid head"><span class="red">Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
  <div class="grid" id="days"></div>
  <p class="sub legend"><i class="dot hol"></i> Holiday (common PH list — confirm with official proclamations) · <i class="dot tdy"></i> Today (Manila time)</p>
</main>

<section class="panel agenda">
  <div class="tabs agtabs" role="tablist" aria-label="Under the calendar">
    <button class="on" id="agT1" data-ag="soon" role="tab" aria-selected="true">📌 <span id="agTitle">Coming up</span></button>
    <button id="agT2" data-ag="done" role="tab" aria-selected="false">✅ Completed <em id="agDoneN">0</em></button>
  </div>
  <div id="agList"></div>
</section>

<div id="modal" class="overlay" hidden>
  <div class="panel board" role="dialog" aria-modal="true">
    <div class="bhead">
      <div><h2 id="bTitle"></h2><div id="bHol" class="holtag"></div><span class="pill" id="bMode"></span></div>
      <button class="x" id="bClose" title="Close (Esc)" aria-label="Close">×</button>
    </div>
    <div class="tabs">
      <button data-v="board" class="on">📋 Board</button>
      <button data-v="done">✅ Completed <span id="cDone">0</span></button>
      <button data-v="trash" id="tabTrash">🗑 Trash <span id="cTrash">0</span></button>
    </div>
    <div id="bBody"></div>
  </div>
</div>

<div id="acct" class="overlay" hidden>
  <form class="panel dlg" id="acctF">
    <h2>🔑 Change password</h2>
    <p class="sub" id="acctNote">Use at least 8 characters.</p>
    <input id="cp0" type="password" placeholder="Current password" autocomplete="current-password" required>
    <input id="cp1" type="password" placeholder="New password" minlength="8" autocomplete="new-password" required>
    <input id="cp2" type="password" placeholder="Repeat new password" minlength="8" autocomplete="new-password" required>
    <div class="row"><button class="btn pri" type="submit">Save password</button><button class="btn" type="button" id="cpX">Cancel</button></div>
  </form>
</div>
<div id="prof" class="overlay" hidden>
  <div class="panel dlg profdlg" role="dialog" aria-modal="true" aria-labelledby="profT">
    <h2 id="profT">👤 My profile</h2>
    <div class="profcard">
      <div class="avbig" id="avBig"></div>
      <b id="profName"></b>
      <span class="sub" id="profSub"></span>
    </div>
    <p class="sub" id="avNote"></p>
    <label class="repck" id="hideRow"><input type="checkbox" id="hideProf"> Hide my profile from other users <span class="sub">(they see only your name and role)</span></label>
    <input id="avFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <div class="row">
      <button class="btn" type="button" id="acctBtn">🔑 Change password</button>
      <button class="btn" type="button" id="avPick">📷 Choose photo</button>
      <button class="btn pri" type="button" id="avSave" disabled>Save photo</button>
    </div>
    <div id="profPosts"></div>
    <button class="btn" type="button" id="profX">Close</button>
  </div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
<script src="repeat.js" defer></script>
<script src="chat.js" defer></script><script src="friends.js" defer></script><script src="posts.js" defer></script>
</body>
</html>
