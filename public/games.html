<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a7fc4">
<meta name="color-scheme" content="light dark">
<title>Games · CrewCamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Fredoka:wght@400..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="friends.css">
<link rel="stylesheet" href="posts.css">
<link rel="stylesheet" href="chess.css">
<script src="icons.js" defer></script>
</head>
<body class="th-white" data-games>
<script src="auth.js"></script>
<script src="servers.js" defer></script>
<script src="chat.js" defer></script><script src="friends.js" defer></script><script src="posts.js" defer></script>
<script>window.openProfile=async()=>{const d=await currentUser();if(d&&d.user&&window.__cwCore)window.__cwCore.openProfile(d.user.id)};</script>

<header class="panel top">
  <div class="brand"><h1 class="logo-h" style="font:700 clamp(1.2rem,4vw,1.6rem) Fredoka,sans-serif;margin:0">Games</h1><p class="sub">Play your crew. Pick a game, open a table, or join one.</p></div>
  <div class="toolbar"><span class="stat who-tag" id="who"></span></div>
</header>

<main class="gm-wrap">
  <div class="gm-tabs" role="group" aria-label="Games"><button class="gm-tile" aria-pressed="true" type="button"><i>♞</i><span>Chess<small>2 players · live clocks</small></span></button></div>
  <section id="lobby" class="gm-lobby">
    <div class="gm-card">
      <h2>New game</h2>
      <div class="gm-row"><label for="nwMin">Time each</label><select id="nwMin"><option value="1">1 min</option><option value="3">3 min</option><option value="5">5 min</option><option value="10" selected>10 min</option><option value="15">15 min</option><option value="30">30 min</option></select>
      <label for="nwInc">Bonus per move</label><select id="nwInc"><option value="0" selected>None</option><option value="1">+1 s</option><option value="2">+2 s</option><option value="3">+3 s</option><option value="5">+5 s</option><option value="10">+10 s</option></select>
      <label for="nwTo">Opponent</label><select id="nwTo"><option value="">Anyone (open table)</option></select>
      <label for="nwCol">Play as</label><select id="nwCol"><option value="random">Random</option><option value="white">White</option><option value="black">Black</option></select></div>
      <button class="btn pri" id="nwGo" type="button">Open a table</button>
      <p class="sub" id="nwErr" role="alert"></p>
      <h3 style="margin-top:14px">My games</h3><ul class="gm-list" id="mine"></ul>
    </div>
    <div class="gm-card"><h2>Open tables</h2><ul class="gm-list" id="open"></ul>
      <h3 style="margin-top:14px">Live games</h3><ul class="gm-list" id="live"></ul></div>
  </section>
  <section id="play" class="gm-play" hidden>
    <div class="gm-board-col">
      <div class="gm-strip" id="topS"><div class="nm"><span id="topN"></span><small id="topC"></small></div><span class="gm-clock" id="topK">0:00</span></div>
      <div class="gm-board" id="board" role="grid" aria-label="Chess board"></div>
      <div class="gm-strip" id="botS"><div class="nm"><span id="botN"></span><small id="botC"></small></div><span class="gm-clock" id="botK">0:00</span></div>
    </div>
    <aside class="gm-side">
      <div class="gm-card"><div class="gm-status" id="stat" aria-live="polite"></div><p class="sub" id="err" role="alert"></p>
        <div class="gm-row"><button class="btn" id="draw" type="button">Offer draw</button><button class="btn" id="resign" type="button">Resign</button><button class="btn pri" id="rematch" type="button" hidden>Rematch</button><button class="btn" id="cancel" type="button" hidden>Cancel table</button><button class="btn" id="flip" type="button" title="Flip the board">Flip board</button><button class="btn" id="snd" type="button" aria-pressed="true" title="Move sounds">Sound: on</button><button class="btn" id="pgn" type="button" title="Copy the game as PGN">Copy PGN</button><button class="btn" id="back" type="button">Back to lobby</button></div></div>
      <div class="gm-card" id="drB" hidden><span id="drT" aria-live="polite"></span><div class="gm-row"><button class="btn pri" id="drAcc" type="button">Accept</button><button class="btn" id="drDec" type="button">Decline</button></div></div>
      <div class="gm-card"><h3>Captured</h3><div class="gm-cap" id="capW"></div><div class="gm-cap" id="capB"></div></div>
      <div class="gm-card"><h3>Moves</h3><div class="gm-row gm-nav" role="group" aria-label="Review moves"><button class="btn" id="rvF" type="button" aria-label="First position">⏮</button><button class="btn" id="rvP" type="button" aria-label="Previous move">◀</button><button class="btn" id="rvN" type="button" aria-label="Next move">▶</button><button class="btn" id="rvL" type="button" aria-label="Latest position">⏭</button></div><div class="gm-moves" id="mv"></div></div>
      <div class="gm-card" id="chatC" hidden><h3>Chat</h3><div class="gm-chat" id="chatL" aria-live="polite"></div>
        <div class="gm-row gm-send" id="chatR"><input id="chatI" type="text" maxlength="200" placeholder="Say something…" autocomplete="off" aria-label="Chat message"><button class="btn pri" id="chatS" type="button">Send</button></div></div>
    </aside>
  </section>
</main>
<div class="gm-promo" id="promo" hidden><div class="box" role="dialog" aria-modal="true" aria-label="Promote pawn">Promote to<div><button data-p="q">♛</button><button data-p="r">♜</button><button data-p="b">♝</button><button data-p="n">♞</button></div></div></div>
<div id="toast"></div>
<script src="chess.js"></script>
</body>
</html>
